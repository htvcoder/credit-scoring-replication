services:
  website:
    image: ${WEBSITE_IMAGE:?WEBSITE_IMAGE is required}
    container_name: credit-scoring-website-prod
    restart: unless-stopped
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ | grep -q OK"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
