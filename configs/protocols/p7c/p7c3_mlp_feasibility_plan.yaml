  validation: exact_identity_coverage_no_duplicate_no_corrupt_no_unexpected
execution_approval:
  status: required_before_execution
  unresolved_thresholds:
  - maximum_wall_clock_seconds_per_fit
  - maximum_peak_rss_bytes_per_fit
  - timeout_seconds
  - cpu_feasible_decision_threshold
  - gpu_preferred_or_required_decision_threshold
decision_rules:
  artifact_completion_pass: all_60_identities_complete_and_validate_with_no_unexpected_duplicate_or_corrupt_artifact
  artifact_completion_fail: any_non_retryable_contract_failure_or_missing_identity_after_approved_retry_policy
  resource_decision: inconclusive_until_all_execution_approval_thresholds_are_explicitly_approved_before_run
  cpu_feasible: cannot_be_declared_without_approved_cpu_thresholds
  gpu_required_or_preferred: cannot_be_declared_without_approved_thresholds_or_gpu_evidence
  mlp_5: must_not_be_excluded_from_core_scope_on_predictive_results_or_this_engineering_plan_alone
  full_or_reduced_grid: no_grid_reduction_or_candidate_selection_from_this_plan
scientific_execution:
  status: not_authorized
  prerequisite: p7c_3_decision_then_p7c_4_through_p7c_7_readiness_gate
