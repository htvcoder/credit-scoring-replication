  automatic_mlp_5_exclusion: forbidden
  automatic_grid_reduction: forbidden
decision_rules:
  artifact_completion_pass: all_60_identities_complete_and_validate_with_no_unexpected_duplicate_or_corrupt_artifact
  artifact_completion_fail: any_non_retryable_contract_failure_or_missing_identity_after_approved_retry_policy
  resource_decision: inconclusive_until_60_fits_complete_and_projected_against_project_compute_policy
