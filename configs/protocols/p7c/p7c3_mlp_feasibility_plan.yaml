  concurrent_fits: 1
  torch_intraop_threads: 2
  per_fit_timeout_seconds: 1800
  retry_maximum: 1
  retry_only: transient_infrastructure
  total_wall_time_seconds: 43200
  rss_warning_bytes: 10737418240
  rss_hard_bytes: 12348030976
  disk_free_floor_bytes: 16106127360
  full_scientific_cpu_target_seconds: 604800
  full_scientific_cpu_hard_ceiling_seconds: 1209600
  cpu_projection_over_hard_ceiling: gpu_benchmark_or_proposal_required_before_full_run
