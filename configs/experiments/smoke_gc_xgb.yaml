experiment:
  name: smoke_gc_xgb
  purpose: smoke_validation
  publishable: false

dataset:
  id: GC

split:
  strategy: stratified_holdout
  test_size: 0.2
  random_seed: 42
  shuffle: true

preprocessing:
  mode: smoke_baseline

model:
  type: xgboost
  parameters:
    n_estimators: 50
    max_depth: 3
    learning_rate: 0.1
    subsample: 1.0
    colsample_bytree: 1.0
    random_state: 42
    n_jobs: 1
    eval_metric: logloss
    tree_method: hist

evaluation:
  classification_threshold: 0.5

output:
  root_dir: artifacts/experiments
