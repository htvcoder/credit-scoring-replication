server {
    listen 8080;
    server_name _;

    # The container listens on 8080 but production publishes host port 80.
    # Do not disclose the container-only listen port in canonical URI redirects.
    port_in_redirect off;
    # Relative redirects preserve any external host, port, proxy, or HTTPS origin.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
