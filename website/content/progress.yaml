      - "P4B: implement/validate ROC AUC, Brier Score và Partial Gini với reference tests độc lập."
      - "P4C: chốt EMP unsupported với provenance rõ ràng, tích hợp metric-validation harness và artifact non-publishable."
      - "Kiểm tra threshold hoặc business parameters không được chọn trên outer test fold."
    deliverables:
