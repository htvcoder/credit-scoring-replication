phases:
  - id: "Phase 0"
    numeric_id: 0
    title: "Xác minh dữ liệu nền tảng"
    name: "Data verification baseline"
    status: "completed"
    tag: "p0-data-verification-baseline"
    summary: "Phase này xác lập baseline dữ liệu verified cho 6 dataset công khai và chuẩn hóa metadata để các phase sau dùng cùng một nguồn sự thật. Công việc cũng ghi rõ caveat HMEQ và thiết lập guard để raw data, processed artifact và secret không lọt vào repository hoặc website."
    tasks:
      - "Kiểm kê 6 dataset công khai và đối chiếu shape, target, class distribution."
      - "Tạo checksum portable và kiểm tra tính toàn vẹn file."
      - "Chuẩn hóa registry metadata, target mapping, numeric/categorical/identifier columns."
      - "Viết data cards và ghi caveat provenance cho HMEQ."
      - "Thiết lập ignore rule, verifier và security guard cho dữ liệu nhạy cảm."
    deliverables:
      - "Registry dataset đã xác minh, checksum, data cards và Phase 0 verification smoke check."
    checkpoints:
      - "Completed với caveat HMEQ; caveat này phải đi kèm khi diễn giải kết quả sau này."
    caveat: "HMEQ full khớp shape/schema/class distribution của paper nhưng checksum không phải checksum SAS artifact kỳ vọng; cần giữ caveat này khi diễn giải."
  - id: "Phase 1"
    numeric_id: 1
    title: "Website và nền tảng công bố"
    name: "Website production foundation"
    status: "completed"
    tag: "p1-website-production-complete"
    summary: "Hoàn thành website học thuật, Docker, CI/CD và triển khai production lên Google Cloud VM. Luồng deploy tự động, manual rollback và automatic failed-deployment rollback đã được kiểm thử thành công."
    tasks:
      - "Hoàn thiện website nội dung, health/version page và content validation."
      - "Docker hóa website, cấu hình CI và security scan."
      - "Thiết lập GitHub Actions deploy qua SSH, GHCR và Google Cloud VM."
      - "Kiểm tra production deployment, health/version check và traceability theo commit."
      - "Kiểm thử manual rollback production."
      - "Kiểm thử automatic failed-deployment rollback."
    deliverables:
      - "Website production hoạt động qua public IP."
      - "CI/CD production operational."
      - "Manual rollback: PASS."
      - "Automatic rollback: PASS."
    checkpoints:
      - "P1A Completed; P1B Completed; P1C Completed."
      - "Không còn checkpoint bắt buộc cho Phase 1."
      - "Domain và HTTPS Optional, không ảnh hưởng acceptance của Phase 1."
    caveat: "Manual rollback production và automatic failed-deployment rollback đã PASS. Domain và HTTPS vẫn Optional; website hiện dùng HTTP/public IP cho nội dung công khai, không có đăng nhập hoặc dữ liệu nhạy cảm."
  - id: "Phase 2"
    numeric_id: 2
    title: "Nền tảng thực nghiệm và smoke test"
    name: "Experiment foundation"
    status: "completed"
    tag: "p2-experiment-foundation-complete"
    summary: "Đã hoàn thiện nền tảng dữ liệu và thực nghiệm có khả năng tái tạo: loader cho sáu bộ dữ liệu công khai, chuẩn hóa nhãn, deterministic stratified split, kiểm tra checksum, experiment artifact contract và smoke runner với Logistic Regression/XGBoost."
    tasks:
      - "Hỗ trợ đầy đủ 6 public datasets qua registry và loader thống nhất."
      - "Chuẩn hóa target về 0 = non-default/good và 1 = default/bad; loại bỏ identifier columns như TC ID và GMC Unnamed: 0."
      - "Tạo split train/test deterministic bằng seed, stratification và split hash."
      - "Ghi artifact có config, dataset checksum, config hash, split hash và Git provenance."
      - "Chạy smoke runner thành công với GC Logistic Regression, GC XGBoost và TC Logistic Regression."
      - "Kiểm tra reproducibility và leakage safety cho pipeline smoke."
    deliverables:
      - "Dataset loader và inspection CLI cho 6 dataset công khai."
      - "Deterministic split artifacts cho GC và TC."
      - "Smoke experiment runner, metrics/predictions/model metadata artifacts hợp lệ."
      - "Test suite: 78 tests pass tại thời điểm nghiệm thu."
    checkpoints:
      - "P2A Completed; P2B Completed; P2C Completed."
      - "Clean test environment cài bằng python -m pip install -e \".[test]\" và pip check pass."
      - "Smoke artifacts có publishable: false và result_scope: smoke_validation."
    caveat: "Các chỉ số từ smoke experiment chỉ dùng để xác minh pipeline kỹ thuật, chưa phải kết quả tái lập hoặc đánh giá mô hình chính thức."
  - id: "Phase 3"
    numeric_id: 3
    title: "Preprocessing chống leakage"
    name: "Leakage-safe preprocessing"
    status: "completed"
    tag: "p3-leakage-safe-preprocessing-complete"
    summary: "Phase 3 đã hoàn thành nền tảng preprocessing và nested CV chống leakage. P3A bổ sung train-only numeric mean imputation, categorical mode imputation với tie-break deterministic, xử lý unseen category, fitted metadata immutable và transform diagnostics tách khỏi fitted state. P3B bổ sung WOE cho categorical features, numeric passthrough sau imputation vì paper không đặc tả numeric binning, smoothing mặc định 0.5, unknown WOE fallback 0.0, iterative VIF threshold mặc định 10.0, zero-variance filtering trước VIF và optional train-only standard scaling. P3C bổ sung deterministic repeated stratified two-fold outer CV, stratified inner CV, deterministic seed derivation, fold hashes, nested CV hash, fresh preprocessing pipeline cho từng fold, outer-test isolation, tuning chỉ dựa trên inner validation và non-publishable preprocessing-validation artifacts."
    tasks:
      - "P3A: train-only numeric mean imputation và categorical mode imputation."
      - "P3A: deterministic mode tie-break, unseen-category handling, immutable fitted preprocessing metadata và transform diagnostics tách khỏi fitted state."
      - "P3B: categorical WOE, numeric passthrough sau imputation, smoothing 0.5, unknown fallback 0.0, iterative VIF threshold 10.0, zero-variance filtering và optional train-only standard scaling."
      - "P3C: deterministic repeated stratified two-fold outer CV, stratified inner CV, deterministic seed derivation, fold hashes và nested CV hash."
      - "P3C: fresh preprocessing pipeline cho từng fold, outer-test isolation và tuning chỉ dựa trên inner validation."
    deliverables:
      - "Leakage-safe preprocessing contract P3A."
      - "WOE, iterative VIF và optional train-only scaling P3B."
      - "Nested CV, fold persistence, per-fold preprocessing và tuning-isolation foundation P3C."
      - "Non-publishable preprocessing-validation artifacts."
    checkpoints:
      - id: "P3A"
        status: "completed"
        summary: "Preprocessing contract và train-only imputation."
      - id: "P3B"
        status: "completed"
        summary: "WOE, iterative VIF và train-only scaling."
      - id: "P3C"
        status: "completed"
        summary: "Nested CV, fold persistence, per-fold preprocessing và tuning isolation."
    caveat: "Phase 3 chỉ hoàn thành preprocessing và nested-CV foundation. Chưa có validated scientific metrics, chưa chạy core replication và chưa có kết quả khoa học để công bố. Smoke/reduced artifacts vẫn là non-publishable validation artifacts. Phase 4 - Metric validation là bước tiếp theo."
  - id: "Phase 4"
    numeric_id: 4
    title: "Metric và đánh giá kinh doanh"
    name: "Metric validation"
    status: "in_progress"
    summary: "Phase này xác minh các metric dự báo và metric kinh doanh trước khi chạy core experiment quy mô lớn. P4A đã chốt metric specification, typed metric result contract và decision record cho Partial Gini/EMP. P4B/P4C vẫn phải validate implementation; Phase 4 chưa Completed và chưa có scientific results."
    tasks:
      - "P4A: audit metric/evaluation hiện có, chốt specification và metric contract."
      - "P4A: ghi decision record cho Partial Gini b = 0.4 và EMP."
      - "P4B: implement/validate AUC, Brier Score và Partial Gini với reference tests."
      - "P4C: xác định EMP exact/approximate/unsupported và tích hợp metric-validation harness."
      - "Kiểm tra threshold hoặc business parameters không được chọn trên outer test fold."
    deliverables:
      - "Metric specification và decision record P4A."
      - "Typed metric result/specification contract."
      - "Evaluation engine, metric validation suite và fold-level results schema trong P4B/P4C."
    checkpoints:
      - id: "P4A"
        status: "completed"
        summary: "Metric specification và metric contract."
      - id: "P4B"
        status: "planned"
        summary: "AUC, Brier Score và Partial Gini implementation/reference validation."
      - id: "P4C"
        status: "planned"
        summary: "EMP, integration và metric-validation harness."
    caveat: "P4A không tạo scientific results, không triển khai production Partial Gini/EMP và không công bố validation metrics lên website."
  - id: "Phase 5"
    numeric_id: 5
    title: "Mô hình truyền thống và ensemble"
    status: "planned"
    summary: "Phase này triển khai các baseline chính của paper bằng cùng preprocessing và evaluation protocol. Kết quả baseline là điều kiện để so sánh MLP, XGBoost và modern reassessment sau này."
    tasks:
      - "Implement Logistic Regression, Decision Tree/CART hoặc C4.5 nếu khả thi."
      - "Implement Random Forest và XGBoost với probability output."
      - "Thiết lập model factory, hyperparameter search và reduced/paper-reference configs."
      - "Export fold-level predictions, configs và runtime tracking."
      - "Ghi rõ deviation nếu dùng CART thay cho C4.5."
    deliverables:
      - "Baseline model artifacts, fold-level predictions và aggregated baseline metrics."
    checkpoints:
      - "Không gọi Decision Tree là C4.5 nếu implementation thực tế là CART approximation."
  - id: "Phase 6"
    numeric_id: 6
    title: "MLP depth replication"
    status: "planned"
    summary: "Phase này kiểm tra ảnh hưởng của độ sâu MLP để trả lời RQ2 trong phạm vi partial replication. Các cấu hình MLP-1, MLP-3 và MLP-5 phải dùng training setup nhất quán và log đầy đủ."
    tasks:
      - "Implement MLP-1, MLP-3 và MLP-5 bằng cùng model contract."
      - "Thiết lập early stopping, seed control và normalization train-only."
      - "Lưu training logs, convergence checks và learning curves."
      - "Chạy smoke/reduced run trên GC/TC trước khi mở rộng."
      - "Theo dõi runtime để quyết định budget khả thi."
    deliverables:
      - "Kết quả MLP theo độ sâu, learning curves và comparison artifact cho RQ2."
    checkpoints:
      - "MLP-1/3/5 smoke phải pass và runtime phải được log trước Phase 7."
  - id: "Phase 7"
    numeric_id: 7
    title: "Core replication run"
    status: "planned"
    summary: "Phase này chạy core replication trên 6 dataset public đủ điều kiện với Protocol A và các model core. Chỉ fold-level/aggregated artifacts đã validate mới được dùng cho thống kê và website."
    tasks:
      - "Chạy dry run, smoke run và reduced/full approved run theo resource."
      - "Chạy LR, DT/CART, RF, XGBoost và MLP-1/3/5 trên dataset đã chốt."
      - "Validate incremental results, resume failed folds và chạy GMC sau cùng."
      - "Lưu predictions, metrics, configs, runtime và failure logs."
      - "Gắn HMEQ caveat vào mọi report liên quan."
    deliverables:
      - "Fold-level predictions, metrics, configs, runtime logs và evidence package cho RQ1/RQ2."
    checkpoints:
      - "Mỗi dataset-model Must phải có artifact hợp lệ hoặc failure status rõ; không tạo result giả."
  - id: "Phase 8"
    numeric_id: 8
    title: "Modern reassessment"
    status: "planned"
    summary: "Phase này đánh giá lại kết luận ưu tiên XGBoost bằng mô hình tabular hiện đại. CatBoost là minimum evidence bắt buộc cho RQ3; TabNet và FT-Transformer phụ thuộc resource checkpoint."
    tasks:
      - "Implement CatBoost trước với tuning budget so sánh được với XGBoost."
      - "Tách rõ Protocol A và Protocol B, không trộn kết quả."
      - "Theo dõi runtime/resource và probability output."
      - "Chạy TabNet nếu resource checkpoint pass."
      - "Chạy FT-Transformer nếu resource checkpoint pass hoặc ghi no-go hợp lệ."
    deliverables:
      - "Modern reassessment artifacts, bằng chứng trả lời RQ3 và resource/no-go report."
    checkpoints:
      - "CatBoost là bắt buộc cho RQ3; no-go của TabNet/FT không làm hỏng core scope nếu có lý do hợp lệ."
  - id: "Phase 9"
    numeric_id: 9
    title: "So sánh thống kê"
    status: "planned"
    summary: "Phase này tổng hợp fold-level result và chạy statistical comparison đúng đơn vị thống kê. Kết quả replication core và modern reassessment phải được phân tích riêng, đặc biệt khi Protocol A/B khác nhau."
    tasks:
      - "Aggregate per dataset/model và tính average rank."
      - "Chạy Friedman/Rom cho so sánh chính."
      - "Chạy Nemenyi cho phân tích MLP depth nếu đủ điều kiện."
      - "Chạy Bayesian signed-rank với ROPE nếu implementation đã xác minh."
      - "Tạo publication-ready tables và limitation summary."
    deliverables:
      - "Statistical summary, model ranking và evidence package cho RQ1/RQ2/RQ3."
    checkpoints:
      - "Phase 9 phụ thuộc Phase 7; nếu trả lời RQ3 đầy đủ thì cần CatBoost từ Phase 8."
  - id: "Phase 10"
    numeric_id: 10
    title: "Robustness"
    status: "planned"
    summary: "Phase này kiểm tra độ ổn định của kết luận với seed, preprocessing, metric, dataset caveat và protocol. Mục tiêu là phân biệt kết luận ổn định với kết luận phụ thuộc điều kiện."
    tasks:
      - "Chạy hoặc aggregate seed sensitivity và fold sensitivity."
      - "Kiểm tra HMEQ include/exclude, GMC influence và preprocessing sensitivity."
      - "So sánh Protocol A/B khi có modern results."
      - "Kiểm tra metric sensitivity, calibration/Brier sanity và runtime/resource sensitivity."
      - "Cập nhật deviation register nếu robustness phát hiện rủi ro diễn giải."
    deliverables:
      - "Robustness report, sensitivity tables và risk-to-conclusion summary."
    checkpoints:
      - "Sensitivity Must không được để lại blocker chưa xử lý trước Phase 11."
  - id: "Phase 11"
    numeric_id: 11
    title: "Báo cáo cuối và website kết quả"
    status: "planned"
    summary: "Phase này đóng gói kết quả cuối, cập nhật website bằng kết quả đã kiểm chứng và chuẩn bị reproducibility package. Website chỉ công bố aggregated/sanitized artifacts, không công bố row-level prediction hoặc dữ liệu nhạy cảm."
    tasks:
      - "Generate tables, figures, RQ summary, limitations và deviation register."
      - "Chạy public result exporter để validate và sanitize artifacts."
      - "Cập nhật website result pages bằng bảng, hình và kết luận đã kiểm chứng."
      - "Viết reproducibility guide, runbook và artifact manifest."
      - "Verify clean clone, final smoke test và production deployment cuối."
    deliverables:
      - "Final report, website kết quả, reproducibility package, final documentation và handover checklist."
    checkpoints:
      - "Không tuyên bố full replication; không overclaim từ 6 public datasets; chỉ publish aggregated artifacts."
