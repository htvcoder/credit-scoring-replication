title: "Partial replication và đánh giá lại mô hình credit scoring"
short_description: "Đề tài thực tập xây dựng nền tảng công bố và tái lập có kiểm soát cho nghiên cứu credit scoring dựa trên paper Deep Learning for Credit Scoring: Do or Don't?"
internship_goal: "Xây dựng website giới thiệu đề tài, chuẩn hóa nguồn metadata và chuẩn bị nền tảng để các phase sau công bố kết quả đã được kiểm chứng."
work_scope:
  - "Tổng hợp nội dung nền tảng của đề tài thực tập."
  - "Hiển thị phạm vi dữ liệu công khai và caveat quan trọng."
  - "Mô tả câu hỏi nghiên cứu, phương pháp dự kiến và tiến độ phase."
  - "Giữ trang kết quả ở trạng thái placeholder cho đến khi có kết quả thực nghiệm thật."
student: "Hoàng Trọng Vĩnh (26ai.vinhht@vinuni.edu.vn)"
supervisor: "Trần Công Phú Khánh (v.dir.fintech.rwa.data.ai@vinsmartfuture.tech)"
unit_or_program: "Vinsmart Future - Fintech"
timeframe: "16/07/2026 - 26/08/2026"
repository: "https://github.com/htvcoder/credit-scoring-replication"
website_role: "Website là kênh trình bày thông tin công khai của đề tài; trong P1A website chỉ chạy local và chưa triển khai production."
