title: "Tái lập và đánh giá lại mô hình tính điểm tín dụng"
short_description: "Đề tài tái lập có kiểm soát nghiên cứu “Deep Learning for Credit Scoring: Do or Don’t?” trên các bộ dữ liệu công khai đã được xác minh, đồng thời đánh giá lại các kết luận của nghiên cứu bằng các mô hình học máy truyền thống, mạng nơ-ron nhiều lớp và một số mô hình tabular hiện đại. Kết quả được đánh giá bằng các chỉ số dự báo, chỉ số kinh doanh và phương pháp so sánh thống kê phù hợp."
project_goal: "Tái lập các kết luận chính của paper trên 6 bộ dữ liệu công khai đã được xác minh; kiểm tra lại hiệu quả của các mô hình truyền thống, ensemble và MLP-1/3/5; đánh giá lại kết luận ưu tiên XGBoost bằng CatBoost, với TabNet và FT-Transformer phụ thuộc tài nguyên; xây dựng pipeline chống leakage, truy vết được, tái tạo được; so sánh bằng metric, kiểm định thống kê và robustness analysis; chỉ công bố kết quả aggregated đã được kiểm chứng."
work_scope:
  - "Xác minh, chuẩn hóa và quản lý metadata cho 6 bộ dữ liệu công khai: AC, GC, HMEQ, TH02, TC và GMC."
  - "Ghi rõ paper gốc sử dụng 10 dataset, nhưng dự án hiện chỉ có 6 dataset công khai đủ điều kiện; đây là giới hạn phạm vi, không phải tên đề tài."
  - "Xây dựng pipeline load dữ liệu, chia fold, preprocessing và kiểm soát data leakage."
  - "Triển khai Logistic Regression, Decision Tree/CART hoặc C4.5 nếu khả thi, Random Forest, XGBoost, MLP-1, MLP-3 và MLP-5."
  - "Đánh giá hiện đại tối thiểu bằng CatBoost; TabNet và FT-Transformer là phần mở rộng phụ thuộc tài nguyên."
  - "Đánh giá bằng AUC, Brier Score, Partial Gini và EMP nếu công thức được xác minh."
  - "Thực hiện so sánh thống kê, robustness/sensitivity analysis, tổng hợp báo cáo, limitation, deviation register và kết quả đã được kiểm chứng."
  - "Dùng website để báo cáo tiến độ, mô tả phương pháp và công bố kết quả aggregated đã được duyệt; không công bố raw data hoặc prediction cấp bản ghi."
student: "Hoàng Trọng Vĩnh (26ai.vinhht@vinuni.edu.vn)"
supervisor: "Trần Công Phú Khánh (v.dir.fintech.rwa.data.ai@vinsmartfuture.tech)"
unit_or_program: "Vinsmart Future - Fintech"
timeframe: "16/07/2026 - 26/08/2026"
repository: "https://github.com/htvcoder/credit-scoring-replication"
website_role: "Website là công cụ báo cáo tiến độ, trình bày bối cảnh, dữ liệu và phương pháp, công bố các kết quả aggregated đã được kiểm chứng và cung cấp thông tin version/commit đang triển khai. Website không phải môi trường chạy thực nghiệm, không cung cấp raw dataset và không phải mục tiêu nghiên cứu chính của đề tài."
