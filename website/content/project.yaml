title: "Tái lập và đánh giá lại mô hình tính điểm tín dụng"
short_description: "Đề tài tái lập có kiểm soát nghiên cứu “Deep Learning for Credit Scoring: Do or Don’t?” trên các bộ dữ liệu công khai đã được xác minh, đồng thời đánh giá lại các kết luận của nghiên cứu bằng các mô hình học máy truyền thống, mạng nơ-ron nhiều lớp và một số mô hình tabular hiện đại. Kết quả được đánh giá bằng các chỉ số dự báo, chỉ số kinh doanh và phương pháp so sánh thống kê phù hợp."
repository: "credit-scoring-replication"
role_of_website: "Website là công cụ báo cáo tiến độ, trình bày bối cảnh, dữ liệu và phương pháp, công bố các kết quả aggregated đã được kiểm chứng và hiển thị thông tin version/commit đang triển khai. Website không phải môi trường chạy thực nghiệm, không cung cấp raw dataset và không phải mục tiêu nghiên cứu chính của đề tài."
research_questions:
  - id: "RQ1"
    question: "Kết quả chính của paper gốc có tái xuất hiện trên các bộ dữ liệu công khai hay không?"
  - id: "RQ2"
    question: "MLP nhiều lớp ẩn có tiếp tục không tốt hơn MLP một lớp ẩn hay không?"
  - id: "RQ3"
    question: "CatBoost, TabNet hoặc FT-Transformer có làm thay đổi kết luận rằng XGBoost nên được ưu tiên cho credit scoring hay không?"
objectives:
  - "Tái lập các kết luận chính của paper trên 6 bộ dữ liệu công khai đã được xác minh."
  - "Kiểm tra lại hiệu quả của Logistic Regression, Decision Tree/CART hoặc C4.5 nếu khả thi, Random Forest, XGBoost và MLP trong bài toán tính điểm tín dụng."
  - "Đánh giá ảnh hưởng của độ sâu mạng MLP thông qua MLP-1, MLP-3 và MLP-5."
  - "Đánh giá lại kết luận ưu tiên XGBoost bằng CatBoost; TabNet và FT-Transformer chỉ thực hiện nếu điều kiện tài nguyên cho phép."
  - "Xây dựng quy trình thực nghiệm chống leakage, có thể truy vết và có khả năng tái tạo."
  - "So sánh kết quả bằng metric, kiểm định thống kê và robustness analysis phù hợp."
  - "Công bố các kết quả tổng hợp đã được kiểm chứng, không công bố raw data hoặc prediction cấp bản ghi."
scope_notes:
  - "Paper gốc sử dụng 10 dataset; repository hiện có 6 dataset công khai đã được xác minh, nên dự án không tuyên bố tái lập đầy đủ toàn bộ thực nghiệm của paper."
  - "HMEQ giữ caveat provenance: artifact full khớp shape/schema/class distribution nhưng checksum không phải checksum SAS artifact kỳ vọng."
  - "Production website đang hoạt động tại http://34.142.206.15 qua HTTP/public IP; domain và HTTPS vẫn Optional vì website chỉ có nội dung công khai, không có đăng nhập hoặc dữ liệu nhạy cảm."
