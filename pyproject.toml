[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-replication"
version = "0.2.0"
description = "Credit scoring replication experiment foundation."
requires-python = ">=3.11"
dependencies = [
  "pandas==3.0.3",
  "numpy==2.4.6",
  "xlrd==2.0.2",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "xgboost==3.0.5",
  "psutil==7.2.2",
]

[project.optional-dependencies]
neural = [
  "torch>=2.5,<2.13",
]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
